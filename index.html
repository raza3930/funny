<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dost Ho Ya Nahi 😄</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e0, #f7a8b8);
  overflow: hidden;
}

.card {
  width: 92%;
  max-width: 520px;
  min-height: 420px;
  background: white;
  border-radius: 28px;
  padding: 35px 22px;
  text-align: center;
  box-shadow: 0 15px 40px #0002;
}

.emoji {
  font-size: 58px;
}

h1 {
  font-size: 29px;
  margin: 12px 0;
}

p {
  color: #666;
  font-size: 17px;
}

#area {
  position: relative;
  width: 100%;
  height: 170px;
  margin-top: 15px;
  border-radius: 18px;
  background: #fff7f9;
  overflow: hidden;
}

button {
  position: absolute;
  border: none;
  border-radius: 14px;
  padding: 14px 25px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  z-index: 5;

  transition:
    left 0.18s ease,
    top 0.18s ease,
    transform 0.18s ease;
}

#yes {
  left: 24%;
  top: 65px;
  background: #20bd68;
  color: white;
}

#no {
  left: 56%;
  top: 65px;
  background: #ff4d5e;
  color: white;
}

#msg {
  height: 35px;
  margin-top: 12px;
  font-size: 20px;
  font-weight: bold;
  color: #e83e62;
}
</style>
</head>

<body>

<div class="card">

  <div class="emoji" id="emoji">🤔</div>

  <h1 id="question">
    Tum mere dost ho ke nahi? 😏
  </h1>

  <p id="sub">
    Sach-sach jawab dena... 😂
  </p>

  <div id="area">

    <button id="yes">
      YES ❤️
    </button>

    <button id="no">
      NO 😜
    </button>

  </div>

  <div id="msg"></div>

</div>


<script>

const area = document.getElementById("area");

const no = document.getElementById("no");

const yes = document.getElementById("yes");

const msg = document.getElementById("msg");

const emoji = document.getElementById("emoji");

const sub = document.getElementById("sub");


// NO button ko random jagah bhejna
function moveNo() {

  const maxX =
    area.clientWidth - no.offsetWidth - 8;

  const maxY =
    area.clientHeight - no.offsetHeight - 8;

  const x =
    Math.floor(Math.random() * Math.max(1, maxX));

  const y =
    Math.floor(Math.random() * Math.max(1, maxY));

  no.style.left = x + "px";

  no.style.top = y + "px";

  msg.textContent =
    "NO ko pakad nahi paoge 😂🏃";
}


// YES button bhi jagah change kare
function moveYes() {

  const maxX =
    area.clientWidth - yes.offsetWidth - 8;

  const maxY =
    area.clientHeight - yes.offsetHeight - 8;

  yes.style.left =
    Math.floor(Math.random() * Math.max(1, maxX)) + "px";

  yes.style.top =
    Math.floor(Math.random() * Math.max(1, maxY)) + "px";

  msg.textContent =
    "YES! Mujhe pata tha 😎❤️";

  emoji.textContent = "🥰";

  sub.textContent =
    "Dosti officially confirmed! 🎉";
}


// Computer me mouse NO ke paas le jaoge
// to NO bhaag jayega
no.addEventListener("mouseenter", function() {

  moveNo();

});


// NO par click
no.addEventListener("click", function(event) {

  event.preventDefault();

  event.stopPropagation();

  moveNo();

});


// Mobile phone me NO ko touch karne par
no.addEventListener("touchstart", function(event) {

  event.preventDefault();

  moveNo();

}, { passive: false });


// YES click
yes.addEventListener("click", function(event) {

  event.preventDefault();

  msg.innerHTML = `
    Mujhe maloom tha tum YES dabaoge! 😎❤️<br>
    Aakhir tum mere special dost jo ho! 🥰🎉
  `;

  emoji.textContent = "🥰";

  sub.textContent = "Dosti officially confirmed! 🎉";

  moveYes();

});

</script>

</body>
</html>
