<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dost Ho Ya Nahi 😄</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
}

.card{
    width:90%;
    max-width:500px;
    background:white;
    padding:35px 20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px #0003;
}

.emoji{
    font-size:60px;
}

h1{
    font-size:30px;
}

p{
    color:#666;
    font-size:18px;
}

#area{
    position:relative;
    height:180px;
    margin-top:20px;
    background:#fff5f7;
    border-radius:20px;
    overflow:hidden;
}

button{
    position:absolute;
    border:0;
    padding:14px 25px;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#yes{
    left:22%;
    top:65px;
    background:#20c76b;
    color:white;
}

#no{
    left:55%;
    top:65px;
    background:#ff4d5e;
    color:white;
}

#message{
    margin-top:15px;
    font-size:21px;
    font-weight:bold;
    color:#e83e62;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

    <div class="emoji" id="emoji">🤔</div>

    <h1>Tum mere dost ho ke nahi? 😏</h1>

    <p id="sub">
        Sach-sach jawab dena... 😂
    </p>

    <div id="area">

        <button id="yes">YES ❤️</button>

        <button id="no">NO 😜</button>

    </div>

    <div id="message"></div>

</div>


<script>

const area = document.getElementById("area");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const message = document.getElementById("message");
const emoji = document.getElementById("emoji");
const sub = document.getElementById("sub");


function moveNo(){

    let maxX = area.clientWidth - no.offsetWidth - 10;
    let maxY = area.clientHeight - no.offsetHeight - 10;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    no.style.left = x + "px";
    no.style.top = y + "px";

    message.innerHTML =
        "NO ko pakad nahi paoge 😂🏃";
}


// YES button dabane par
yes.addEventListener("click", function(){

    message.innerHTML =
        "Mujhe maloom tha tum YES dabaoge! 😎❤️<br>" +
        "Aakhir tum mere special dost jo ho! 🥰🎉";

    emoji.innerHTML = "🥰";

    sub.innerHTML =
        "Dosti officially confirmed! ❤️🎉";

});


// NO button dabane par bhaagega
no.addEventListener("click", function(){

    moveNo();

});


// Mouse NO ke paas le jaane par bhi bhaagega
no.addEventListener("mouseenter", function(){

    moveNo();

});

</script>

</body>
</html>
